<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2F4F6">
<title>SmartPark Edge — UI Prototype v2</title>
<style>
/* ============ DESIGN TOKENS — map 1:1 onto the existing SmartPark tokens ============ */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-alt:#F7F9FB; --surface-alt-2:#EDF1F5;
  --text-primary:#161C24; --text-secondary:#545E6C; --text-tertiary:#8A94A2;
  --border:#E2E6EC; --border-strong:#C9D1DB;
  --accent:#0E7C72; --accent-strong:#0B6A61; --accent-fg:#FFFFFF;
  --success:#17784B; --warning:#A05A0B; --danger:#C0372E; --info:#2B6CB0;
  --overlay:rgba(22,28,36,.5);
  --shadow-1:0 1px 2px rgba(22,28,36,.05); --shadow-2:0 12px 32px rgba(22,28,36,.16);
  --r:6px; --r-lg:10px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0D1117; --surface:#151B22; --surface-alt:#1A222B; --surface-alt-2:#212B36;
  --text-primary:#E7EDF3; --text-secondary:#9AA5B1; --text-tertiary:#667180;
  --border:#242E39; --border-strong:#33404E;
  --accent:#2FBFAD; --accent-strong:#4ACEBD; --accent-fg:#04211D;
  --success:#41B879; --warning:#E0A23E; --danger:#E4584E; --info:#5CA3E4;
  --overlay:rgba(4,8,12,.62);
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 16px 40px rgba(0,0,0,.55);
}
/* ============ base ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.45 var(--sans);color:var(--text-primary);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:var(--text-primary)}
a{color:var(--accent);text-decoration:none}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:2px solid var(--bg)}
::selection{background:color-mix(in srgb,var(--accent) 25%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{flex:none}
.fullscreen{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:50}
/* ============ primitives ============ */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r);font-size:12.5px;font-weight:600;border:1px solid transparent;transition:background .12s,border-color .12s;white-space:nowrap}
.btn-prim{background:var(--accent);color:var(--accent-fg)}
.btn-prim:hover{background:var(--accent-strong)}
.btn-sec{background:var(--surface);border-color:var(--border-strong);color:var(--text-primary)}
.btn-sec:hover{background:var(--surface-alt)}
.btn-ghost{color:var(--text-secondary)}
.btn-ghost:hover{background:var(--surface-alt-2);color:var(--text-primary)}
.btn-dgr{background:var(--danger);color:#fff}
.btn-dgr:hover{filter:brightness(1.08)}
.btn-sm{height:25px;padding:0 9px;font-size:11.5px;gap:5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.loading{pointer-events:none;opacity:.7}
.btn.loading::after{content:"";width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icobtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--r);color:var(--text-secondary)}
.icobtn:hover{background:var(--surface-alt-2);color:var(--text-primary)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.c-ok{color:var(--success);background:color-mix(in srgb,var(--success) 14%,transparent)}
.c-wrn{color:var(--warning);background:color-mix(in srgb,var(--warning) 15%,transparent)}
.c-dgr{color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent)}
.c-info{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent)}
.c-acc{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.c-mut{color:var(--text-secondary);background:var(--surface-alt-2)}
.plate{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.05em;background:var(--surface-alt-2);border:1px solid var(--border);border-radius:4px;padding:1px 7px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:11px;font-weight:600;color:var(--text-secondary)}
.inp{height:32px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);padding:0 10px;width:100%;font-size:12.5px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.inp.err{border-color:var(--danger)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-secondary) 50%),linear-gradient(135deg,var(--text-secondary) 50%,transparent 50%);background-position:calc(100% - 15px) 13px,calc(100% - 10px) 13px;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.ferr{font-size:11px;color:var(--danger);display:flex;gap:4px;align-items:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.card-b{padding:14px}
.meter{height:5px;border-radius:3px;background:var(--surface-alt-2);overflow:hidden;flex:1}
.meter>i{display:block;height:100%;border-radius:3px}
.m-ok>i{background:var(--success)}.m-wrn>i{background:var(--warning)}.m-dgr>i{background:var(--danger)}.m-acc>i{background:var(--accent)}
.skel{background:linear-gradient(90deg,var(--surface-alt) 25%,var(--surface-alt-2) 50%,var(--surface-alt) 75%);background-size:200% 100%;animation:sk 1.1s infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}
/* ============ app shell ============ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:10}
#hdr{height:52px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;z-index:5}
.hdr-l,.hdr-r{display:flex;align-items:center;gap:8px}
.hdr-l{flex:1;min-width:0}
.brandmark{display:flex}
.brandname{font-weight:700;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap}
.siteselect{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border:1px solid var(--border);border-radius:var(--r);color:var(--text-secondary);font-size:12px;font-weight:600;background:var(--surface-alt)}
.siteselect:hover{border-color:var(--border-strong);color:var(--text-primary)}
.healthchip{height:24px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.healthchip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.gsearch{display:flex;align-items:center;gap:7px;background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--r);height:30px;padding:0 9px;width:280px;color:var(--text-tertiary)}
.gsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.gsearch input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:12.5px;color:var(--text-primary)}
.gsearch kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--border-strong);border-radius:3px;padding:0 4px;color:var(--text-tertiary)}
.badge-wrap{position:relative}
.nbadge{position:absolute;top:2px;right:2px;min-width:14px;height:14px;border-radius:7px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
.userbtn{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 3px;border-radius:var(--r)}
.userbtn:hover{background:var(--surface-alt-2)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex:none}
.uname{display:flex;flex-direction:column;line-height:1.2}
.uname b{font-size:12px}.uname i{font-style:normal;font-size:10.5px;color:var(--text-secondary)}
.shell{flex:1;display:grid;grid-template-columns:auto 1fr;min-height:0}
#sidebar{width:236px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;transition:width .18s ease;display:flex;flex-direction:column}
#sidebar.collapsed{width:58px}
#sidebar.collapsed .sl-label,#sidebar.collapsed .sec{display:none}
#sidebar.collapsed .sitem{justify-content:center;padding:0}
.sec{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-tertiary);padding:14px 14px 5px}
.sitem{display:flex;align-items:center;gap:10px;height:33px;padding:0 12px;margin:1px 7px;border-radius:var(--r);color:var(--text-secondary);font-size:12.5px;font-weight:600;position:relative;white-space:nowrap}
.sitem:hover{background:var(--surface-alt-2);color:var(--text-primary)}
.sitem.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.sitem.on::before{content:"";position:absolute;left:-7px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent)}
.side-foot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border);font-size:10.5px;color:var(--text-tertiary);line-height:1.5}
#sidebar.collapsed .side-foot{display:none}
#main{overflow:auto;padding:18px 22px 40px;min-width:0;scroll-behavior:smooth}
.view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.view-head h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.view-head .sub{font-size:12px;color:var(--text-secondary);margin-top:3px}
.va{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ============ stat band ============ */
.statband{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);margin-bottom:16px;overflow:hidden}
.stat{flex:1 1 150px;min-width:150px;padding:13px 16px;border-left:1px solid var(--border)}
.stat:first-child{border-left:0}
.stat .k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:5px;letter-spacing:-.02em}
.stat .v small{font-size:12px;color:var(--text-tertiary);font-weight:500}
.stat .d{font-size:11px;color:var(--text-tertiary);margin-top:3px}
.stat .d.up{color:var(--success)}.stat .d.dn{color:var(--danger)}
/* ============ tables ============ */
.tblwrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{position:sticky;top:0;background:var(--surface);z-index:1;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);padding:9px 12px;border-bottom:1px solid var(--border)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:middle}
.tbl tbody tr{cursor:default}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--surface-alt)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td .mut{color:var(--text-tertiary);font-size:11.5px}
.tblfoot{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;font-size:11.5px;color:var(--text-secondary)}
.pager{display:flex;gap:4px}
.pager button{min-width:24px;height:24px;border-radius:5px;font-size:11.5px;font-weight:600;color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.pager button:hover{background:var(--surface-alt-2)}
.pager button.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
tr.flash{animation:flash 1.8s}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 16%,transparent)}100%{background:transparent}}
.thumb{width:58px;height:32px;border-radius:4px;background:#0B1118;border:1px solid var(--border);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.thumb svg{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);color:#39434F}
.thumb span{position:relative;z-index:1;font-family:var(--mono);font-size:7.5px;color:#E7EDF3;background:rgba(10,15,21,.85);border-radius:2px;padding:0 3px;margin-bottom:2px;letter-spacing:.05em}
/* ============ filters / tabs / chips ============ */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .inp{height:30px;width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:26px;padding:0 11px;border-radius:999px;border:1px solid var(--border);font-size:11.5px;font-weight:600;color:var(--text-secondary);background:var(--surface)}
.fchip:hover{border-color:var(--border-strong)}
.fchip.on{background:color-mix(in srgb,var(--accent) 13%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab{padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--text-primary)}
.tab.on{color:var(--text-primary);border-bottom-color:var(--accent)}
.tabn{font-size:10.5px;background:var(--surface-alt-2);border-radius:999px;padding:1px 7px;font-weight:700}
/* ============ camera / gate cards ============ */
.grid-cams{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.camcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden;display:flex;flex-direction:column}
.vidwrap{position:relative;aspect-ratio:16/9;background:#070B10;overflow:hidden}
.vidwrap canvas{width:100%;height:100%;display:block}
.vid-overlay{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vid-plate{font-family:var(--mono);font-weight:700;font-size:13px;background:#0A0F15;border:1px solid #2A3540;color:#fff;padding:2px 8px;border-radius:4px;letter-spacing:.05em}
.vid-state{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:rgba(10,15,21,.8)}
.cam-body{padding:10px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.cam-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cam-title b{font-size:12.5px}
.cam-title .mut{font-size:11px;color:var(--text-tertiary)}
.kv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-secondary);gap:10px}
.kv b{color:var(--text-primary);font-weight:500}
.cam-actions{display:flex;gap:4px;justify-content:flex-end;border-top:1px solid var(--border);padding:7px 10px;align-items:center}
/* ============ layout helpers ============ */
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;min-width:0}
.grid2-eq{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1250px){.grid2,.grid2-eq{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.rowlist{display:flex;flex-direction:column}
.rowitem{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:12.5px}
.rowitem:last-child{border-bottom:0}
.notice{display:flex;gap:10px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--warning) 35%,transparent);background:color-mix(in srgb,var(--warning) 9%,transparent);border-radius:var(--r);padding:10px 12px;font-size:12px;margin-bottom:12px;color:var(--text-primary)}
.notice .ic{color:var(--warning);margin-top:1px}
.notice .btn{margin-left:auto}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:38px 20px;text-align:center;color:var(--text-secondary)}
.empty .eic{width:44px;height:44px;border-radius:50%;background:var(--surface-alt-2);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary)}
.empty b{color:var(--text-primary);font-size:13px}
.empty p{font-size:12px;max-width:340px}
/* ============ modal / drawer / pop / toast ============ */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px 16px;overflow:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-2);width:560px;max-width:100%;animation:pop .16s}
.modal-wide{width:680px}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:14px;font-weight:700}
.modal-b{padding:16px;max-height:64vh;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
#drawer-root .drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-2);z-index:90;display:flex;flex-direction:column;animation:slidein .18s ease}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border)}
.drawer-h h3{font-size:14px;font-weight:700}
.drawer-b{padding:16px;overflow:auto;flex:1}
.pop{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-2);z-index:110;min-width:200px;animation:pop .12s;overflow:hidden}
.popitem{display:flex;align-items:center;gap:9px;padding:9px 12px;font-size:12.5px;font-weight:500;width:100%;border-bottom:1px solid var(--border);text-align:left}
.popitem:last-child{border-bottom:0}
.popitem:hover{background:var(--surface-alt)}
.popitem .ic{color:var(--text-tertiary)}
.popitem.on{color:var(--accent);font-weight:600}
.pop-sect{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);padding:8px 12px 3px}
#toast-root{position:fixed;top:62px;right:16px;z-index:130;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{display:flex;gap:9px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--success);border-radius:var(--r);box-shadow:var(--shadow-2);padding:10px 13px;font-size:12.5px;animation:slidein .2s}
.toast.warn{border-left-color:var(--warning)}.toast.dgr{border-left-color:var(--danger)}.toast.info{border-left-color:var(--info)}
.toast .ic{margin-top:1px;color:var(--success)}
.toast.warn .ic{color:var(--warning)}.toast.dgr .ic{color:var(--danger)}.toast.info .ic{color:var(--info)}
/* ============ misc components ============ */
.alertcard{display:flex;gap:12px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--danger);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow-1)}
.alertcard.wrn{border-left-color:var(--warning)}
.alertcard.info{border-left-color:var(--info)}
.alert-main{flex:1;min-width:0}
.alert-main .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.alert-main .meta{font-size:11.5px;color:var(--text-secondary)}
.alert-act{display:flex;gap:6px;align-items:flex-start}
.tline{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.tline .tdot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex:none}
.tline .tt{font-family:var(--mono);font-size:11px;color:var(--text-tertiary);min-width:60px}
.wizsteps{display:flex;gap:0;margin-bottom:16px}
.wizstep{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:2px}
.wizstep .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-secondary);background:var(--surface)}
.wizstep.on .n{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.wizstep.done .n{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:var(--accent);color:var(--accent)}
.wizstep .l{font-size:10px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.04em}
.wizstep.on .l{color:var(--accent)}
.choice{border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;display:flex;gap:12px;cursor:pointer;background:var(--surface)}
.choice:hover{border-color:var(--border-strong)}
.choice.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.choice .cic{width:34px;height:34px;border-radius:8px;background:var(--surface-alt-2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.choice b{font-size:13px;display:block}
.choice p{font-size:11.5px;color:var(--text-secondary);margin-top:2px}
.choice .ck{margin-left:auto;color:var(--accent);align-self:flex-start}
details.adv{border:1px solid var(--border);border-radius:var(--r);margin-top:12px}
details.adv summary{cursor:pointer;padding:8px 12px;font-size:11.5px;font-weight:600;color:var(--text-secondary);list-style:none;display:flex;align-items:center;gap:6px}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:"▸";font-size:10px}
details.adv[open] summary::before{content:"▾"}
details.adv .adv-b{padding:0 12px 12px;border-top:1px solid var(--border)}
.kvs{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:12.5px}
.kvs .k{color:var(--text-secondary)}
.platecrop{background:#0A0D11;border:1px solid var(--border-strong);border-radius:6px;padding:10px 16px;display:inline-block}
.platecrop b{font-family:var(--mono);font-size:24px;font-weight:700;color:#F2F5F8;letter-spacing:.12em}
.perm td,.perm th{text-align:center!important}
.perm td:first-child,.perm th:first-child{text-align:left!important}
.perm .modrow th{background:var(--surface-alt);font-size:11px;letter-spacing:.05em;color:var(--accent)}
input.bigck{width:15px;height:15px;accent-color:var(--accent)}
.topo-tree{font-size:12.5px}
.topo-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r);position:relative}
.topo-row:hover{background:var(--surface-alt)}
.topo-row:hover .topo-act{opacity:1}
.topo-act{opacity:0;display:flex;gap:2px;margin-left:auto;transition:opacity .1s}
.topo-row .ic{color:var(--text-secondary)}
.tgrid{display:grid;grid-template-columns:44px repeat(24,1fr);gap:2px}
.tgrid .tcell{height:22px;border-radius:3px;cursor:pointer;border:0;padding:0}
.t-std{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.t-peak{background:color-mix(in srgb,var(--warning) 55%,transparent)}
.t-closed{background:var(--surface-alt-2);border:1px solid var(--border)}
.tgrid .tday{font-size:10.5px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center}
.healthgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gate-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.minilane{border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;background:var(--surface)}
.minilane .t{font-size:11.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.minilane .p{font-family:var(--mono);font-size:13px;font-weight:600;margin:5px 0 4px}
.dash-det{display:grid;grid-template-columns:74px 96px 1fr 60px 92px;gap:8px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--border);font-size:12px}
.dash-det:last-child{border-bottom:0}
.dash-det .tm{color:var(--text-tertiary);font-size:11px}
.recogn-row{display:flex;gap:6px;align-items:center}
/* ============ login / onboarding ============ */
.login-bg{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background-image:radial-gradient(color-mix(in srgb,var(--border-strong) 60%,transparent) 1px,transparent 1px);background-size:26px 26px;position:relative}
.login-card{width:400px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-2);padding:28px}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.login-brand .bn{font-size:17px;font-weight:700}
.login-brand .bv{font-size:10px;color:var(--text-tertiary);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.login-top{position:absolute;top:16px;right:16px;display:flex;gap:6px}
.login-foot{margin-top:26px;text-align:center;font-size:11px;color:var(--text-tertiary);line-height:1.6}
.ob-wrap{max-width:860px;margin:0 auto;padding:48px 20px;display:flex;flex-direction:column;min-height:100%}
.ob-steps{display:flex;gap:8px;margin-bottom:34px;align-items:center}
.ob-step{display:flex;gap:8px;align-items:center;font-size:11.5px;font-weight:600;color:var(--text-tertiary)}
.ob-step .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.ob-step.on{color:var(--text-primary)}
.ob-step.on .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ob-step.done .dot{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--accent);color:var(--accent)}
.ob-step .bar{width:46px;height:1px;background:var(--border)}
.ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ob-grid .span2{grid-column:1/-1}
.ob-foot{display:flex;justify-content:space-between;margin-top:26px}
/* ============ kiosk ============ */
#kiosk{z-index:60;display:flex;flex-direction:column;background:var(--bg)}
.k-top{display:flex;justify-content:space-between;align-items:center;padding:18px 26px}
.k-clock{font-family:var(--mono);font-size:22px;font-weight:600}
.k-mid{flex:1;display:flex;align-items:center;justify-content:center;padding:0 20px 40px}
.k-panel{width:560px;max-width:100%;text-align:center}
.k-title{font-size:19px;font-weight:700;margin-bottom:6px}
.k-sub{font-size:13px;color:var(--text-secondary);margin-bottom:24px}
.k-plate{font-family:var(--mono);font-size:46px;font-weight:700;letter-spacing:.14em;background:var(--surface);border:2px solid var(--border-strong);border-radius:12px;padding:14px 10px;min-height:86px;display:flex;align-items:center;justify-content:center}
.k-pad{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin:22px 0}
.k-key{height:46px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-family:var(--mono);font-size:15px;font-weight:600}
.k-key:hover{border-color:var(--accent)}
.k-pay{height:58px;border-radius:10px;font-size:16px;font-weight:700;letter-spacing:.02em}
.k-amount{font-family:var(--mono);font-size:44px;font-weight:700;margin:14px 0}
.spin-lg{width:40px;height:40px;border:3px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:26px auto}
.linkish{color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer}
@media (max-width:1380px){.gsearch{width:210px}}
@media (max-width:1180px){.gsearch kbd{display:none}}

  return same?fmtT(ts):['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function ago(ts){const s=Math.max(0,Math.round((Date.now()-ts)/1000));
  if(s<8)return'just now';if(s<60)return s+' sec ago';const m=Math.round(s/60);
  if(m<60)return m+' min ago';return Math.round(m/60)+' h ago'}
function durStr(from,to){const m=Math.max(0,Math.round(((to||Date.now())-from)/60000));
  return m<60?m+' min':Math.floor(m/60)+'h '+pad(m%60)+'m'}
function fmtMoney(n){try{return new Intl.NumberFormat(S.conf.locale||'en',{style:'currency',currency:S.conf.currency||'USD',maximumFractionDigits:0}).format(n)}catch(e){return n+' '+S.conf.currency}}

/* ---------------- camera feed simulator ---------------- */
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function rr(x,a,b,w,h,r){
  const rad=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  x.beginPath();
  if(x.roundRect){x.roundRect(a,b,w,h,rad);return}
  x.moveTo(a+rad,b);x.arcTo(a+w,b,a+w,b+h,rad);x.arcTo(a+w,b+h,a,b+h,rad);
  x.arcTo(a,b+h,a,b,rad);x.arcTo(a,b,a+w,b,rad);x.closePath();
}
function drawLaneFrame(x,cam,p,W,H,plate,conf){
  x.fillStyle='#0A0F15';x.fillRect(0,0,W,H);
  x.fillStyle='#0D141C';x.fillRect(0,H*0.42,W,H*0.58);
  x.strokeStyle='rgba(140,150,165,.12)';x.lineWidth=1;x.beginPath();x.moveTo(0,H*0.42);x.lineTo(W,H*0.42);x.stroke();
  const off=(Date.now()/8)%46;
  x.strokeStyle='rgba(200,210,225,.20)';x.lineWidth=3;x.setLineDash([24,22]);x.lineDashOffset=-off;
  x.beginPath();x.moveTo(0,H*0.72);x.lineTo(W,H*0.72);x.stroke();x.setLineDash([]);
  if(p<0.78){
    const cx=-100+(W+240)*(p/0.78), cy=H*0.60, sc=0.62+0.55*Math.sin(Math.min(p/0.78,1)*Math.PI);
    const bw=150*sc,bh=44*sc;
    x.fillStyle=cam.color||'#5C7A99';
    rr(x,cx,cy-bh,bw,bh,8*sc);x.fill();
    rr(x,cx+bw*0.22,cy-bh-bh*0.62,bw*0.5,bh*0.7,6*sc);x.fill();
    x.fillStyle='rgba(10,15,21,.55)';
    rr(x,cx+bw*0.26,cy-bh-bh*0.52,bw*0.42,bh*0.5,3*sc);x.fill();
    x.fillStyle='#0A0D11';
    x.beginPath();x.arc(cx+bw*0.2,cy,11*sc,0,7);x.fill();
    x.beginPath();x.arc(cx+bw*0.8,cy,11*sc,0,7);x.fill();
    x.fillStyle='rgba(240,225,160,.9)';x.beginPath();x.arc(cx+bw-4*sc,cy-bh*0.35,3.4*sc,0,7);x.fill();
    if(p>0.32&&p<0.58){
      const px=cx+bw-bw*0.16,py=cy-bh*0.55,pw=34*sc,ph=14*sc;
      x.strokeStyle=cssVar('--accent');x.lineWidth=2;
      x.strokeRect(px-3,py-3,pw+6,ph+6);
      x.fillStyle='rgba(8,12,18,.85)';
      rr(x,px-3,py-3-18*sc,pw+18,15,3);x.fill();
      x.fillStyle='#E7EDF3';x.font='700 '+Math.max(9,10*sc)+'px monospace';x.textAlign='left';
      x.fillText(plate+' · '+conf+'%',px+1,py-3-7*sc);
    }
  }
  grain(x,W,H,26);
}
function drawScene(x,t,W,H,cam){
  x.fillStyle='#0A0F15';x.fillRect(0,0,W,H);
  x.fillStyle='#0C1219';x.fillRect(0,H*0.5,W,H*0.5);
  const pan=Math.sin(t*0.15)*9;
  x.strokeStyle='rgba(150,160,175,.15)';x.lineWidth=2;
  x.beginPath();x.moveTo(0,H*0.5-26);x.lineTo(W,H*0.5-26);x.stroke();
  const cols=[['#31404F',60,150],['#4A4438',210,170],['#3A4A3C',330,130]];
  cols.forEach(c=>{x.fillStyle=c[0];rr(x,c[1]+pan,H*0.5-40+c[2]*0.06,c[2]*0.9,40,6);x.fill();
    x.fillStyle='rgba(10,15,21,.5)';rr(x,c[1]+pan+c[2]*0.2,H*0.5-58+c[2]*0.06,c[2]*0.45,22,4);x.fill()});
  grain(x,W,H,20);
}
function grain(x,W,H,n){for(let i=0;i<n;i++){x.fillStyle='rgba(200,210,225,'+(Math.random()*0.06)+')';x.fillRect(Math.random()*W,Math.random()*H,2,2)}}
function osd(x,t,W,H){
  x.fillStyle='rgba(8,12,18,.7)';rr(x,8,8,86,17,3);x.fill();
  x.fillStyle='rgba(232,237,243,.9)';x.font='600 10px monospace';x.textAlign='left';x.fillText(fmtT(Date.now()),14,20);
  x.fillStyle=(Math.floor(t*2)%2)?'#E4584E':'rgba(228,88,78,.25)';x.beginPath();x.arc(W-16,16,3.4,0,7);x.fill();
  x.fillStyle='rgba(232,237,243,.6)';x.font='600 8.5px monospace';x.fillText('LIVE',W-38,19);
}
class CamSim{
  constructor(cv,cam){this.cv=cv;this.cam=cam;this.x=cv.getContext('2d');this.t0=performance.now();this.ci=RN(0,9);
    cv.width=480;cv.height=270;this.raf=requestAnimationFrame(()=>this.loop())}
  stop(){cancelAnimationFrame(this.raf)}
  loop(){if(!this.cv.isConnected)return;const t=(performance.now()-this.t0)/1000;
    const x=this.x,W=480,H=270;
    x.fillStyle='#0A0F15';x.fillRect(0,0,W,H);
    if(this.cam.st&&this.cam.st.video==='down'){
      for(let i=0;i<400;i++){x.fillStyle='rgba(120,130,145,'+(Math.random()*0.25)+')';x.fillRect(Math.random()*W,Math.random()*H,3,3)}
      x.fillStyle=cssVar('--danger');x.font='700 15px monospace';x.textAlign='center';x.fillText('SIGNAL LOST',W/2,H/2-4);
      x.fillStyle='rgba(210,215,225,.6)';x.font='10px monospace';x.fillText('network reachable · waiting for video',W/2,H/2+18);
    }else if(this.cam.role==='security'){drawScene(x,t,W,H,this.cam)}
    else{
      const P=8.5,p=(t%P)/P,cyc=Math.floor(t/P);
      const plate=PLATES[(this.ci+cyc)%PLATES.length];
      drawLaneFrame(x,this.cam,p,W,H,plate.replace(/\s/g,''),this.cam.conf||93);
    }
    osd(x,t,W,H);
    this.raf=requestAnimationFrame(()=>this.loop())}
}
function drawSnapStatic(cv,det){
  const cam=camById(det.cam)||{role:'lpr',st:{video:'ok'},color:'#5C7A99',conf:det.conf};
  cv.width=480;cv.height=270;const x=cv.getContext('2d');

}
function startSims(root){

/* ---------------- tiny chart renderer ---------------- */
function drawChart(cv,data){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth||420,H=cv.clientHeight||130;
  cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
  const pad=4,max=Math.max.apply(null,data.concat([1]));
  x.strokeStyle=cssVar('--border');x.lineWidth=1;
  for(let i=0;i<=3;i++){const y=pad+(H-2*pad)*i/3;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
  const acc=cssVar('--accent');
  x.beginPath();data.forEach((v,i)=>{const px=4+(W-8)*i/(data.length-1),py=H-pad-(H-2*pad)*v/max;i?x.lineTo(px,py):x.moveTo(px,py)});
  x.strokeStyle=acc;x.lineWidth=2;x.stroke();
  x.lineTo(W-4,H-pad);x.lineTo(4,H-pad);x.closePath();
  x.globalAlpha=.1;x.fillStyle=acc;x.fill();x.globalAlpha=1;
}

    <button class="btn btn-sec" data-action="sess-open" data-id="${sess.id}">${icon('corner-down-right',13)}Open full session</button>`
    :`<div class="empty"><div class="eic">${icon('timer',20)}</div><b>No parking session for this plate</b><p>This detection did not open a session (security camera or outside gate lanes).</p></div>`;
  if(tab==='sec')tabHtml=wl.length?wl.map(w=>`<div class="alertcard ${w.sev==='danger'?'':w.sev==='warning'?'wrn':'info'}" style="margin-bottom:10px">
      <div class="alert-main"><div class="top"><span class="plate">${esc(d.plate)}</span>${chip(w.name.toUpperCase(),w.sev==='danger'?'c-dgr':w.sev==='warning'?'c-wrn':'c-info')}</div>
      <div class="meta">Added by ${esc(w.entries[0].by)} · ${ago(w.entries[0].on)}</div></div>
      ${can('sec.manage')?`<button class="btn btn-sm btn-sec" data-action="wl-del" data-id="${esc(d.plate)}">Remove from list</button>`:''}</div>`).join('')
    :`<div class="empty"><div class="eic">${icon('shield-check',20)}</div><b>No watchlist matches</b><p>This plate does not appear on any watchlist.</p></div>`;
  if(tab==='aud')tabHtml=`<div>${[
    [d.ts,'Detection created · '+camById(d.cam).name+' · '+d.source],
    [d.ts+1000,'Confidence '+d.conf+'% recorded'],
    [d.ts+2000,d.status==='denied'?'Barrier held — access denied':'Barrier command issued'],
    [d.ts+3000,'Event indexed for search']
  ].map(l=>`<div class="tline"><span class="tdot"></span><span class="tt">${fmtT(l[0])}</span><span style="font-size:12.5px">${esc(l[1])}</span></div>`).join('')}</div>`;
  return vhead('Detection Detail','',
    `<button class="btn btn-sec" data-action="nav" data-id="detections">${icon('chevron-left',14)}Back to history</button>`)
  +`<div class="grid2" style="grid-template-columns:400px 1fr;margin-bottom:16px">
    <div class="card"><div class="card-b" style="padding:12px">
      <div class="vidwrap" style="border-radius:8px;overflow:hidden"><canvas class="camcanvas" data-snap='${esc(snap)}'></canvas></div>
      <div style="display:flex;justify-content:center;margin:14px 0 6px"><div class="platecrop"><b>${esc(d.plate.replace(/\s/g,''))}</b></div></div>
      <div style="text-align:center;font-size:11.5px;color:var(--text-secondary)">Plate crop · ${d.conf}% confidence · ${d.source}</div>
    </div></div>
    <div class="stack">
      <div class="card"><div class="card-b"><div class="kvs">
        <span class="k">Time</span><b class="mono">${fmtDT(d.ts)}</b>
        <span class="k">Camera</span><b>${esc(cam?cam.name:'—')} ${cam?stChip(cam.st.video):''}</b>
        <span class="k">Site / lane</span><b>${ln?esc(ln.site.name+' · '+ln.gate.name+' — '+ln.lane.name):'Unassigned'}</b>
        <span class="k">Status</span><b><span class="chip ${st[1]}">${st[0]}</span>${d.wl?' '+chip(d.wl.toUpperCase(),'c-wrn'):''}</b>
        <span class="k">Recognition</span><b>${d.source} · ${d.conf}%</b>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        ${can('park.correct')?`<button class="btn btn-sec btn-sm" data-action="det-correct" data-id="${d.id}">Correct plate</button>`:''}
        ${S.modules.security&&can('sec.manage')?`<button class="btn btn-sec btn-sm" data-action="det-watchlist" data-id="${esc(d.plate)}">Add to watchlist</button>`:''}
        ${S.modules.parking&&sess?`<button class="btn btn-sec btn-sm" data-action="sess-open" data-id="${sess.id}">Open session</button>`:''}
        <button class="btn btn-ghost btn-sm" data-action="det-image" data-id="${d.id}">${icon('download',13)}Save image</button>
      </div></div></div>
    </div>
  </div>
  <div class="tabs">${tabs.map(t=>`<button class="tab ${tab===t[0]?'on':''}" data-action="det-tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>
  <div class="tblwrap" style="border:0">${tabHtml}</div>`;
};
function tariffFor(sess){
  const mins=Math.round(((sess.exit||Date.now())-sess.entry)/60000);
  const b=DB.tariff.brackets.find(x=>mins<=x.to)||DB.tariff.brackets[DB.tariff.brackets.length-1];
  return b.rate;
}

VIEWS.vehicles=()=>{
  const f=S.ui.veh;
  const map={};
  DB.detections.forEach(d=>{
    const v=map[d.plate]||(map[d.plate]={plate:d.plate,first:d.ts,last:d.ts,n:0});
    v.n++;v.first=Math.min(v.first,d.ts);v.last=Math.max(v.last,d.ts);
    if(d.wl)v.wl=true;
    if(DB.subscribers.some(s=>s.plates.includes(d.plate)))v.sub=true;
  });
  let list=Object.values(map).filter(v=>(!f.q||v.plate.toLowerCase().includes(f.q))&&(f.cls==='all'||(f.cls==='sub'&&v.sub)||(f.cls==='wl'&&v.wl)||(f.cls==='vis'&&!v.sub&&!v.wl)));
  return vhead('Vehicles',`${list.length} known plates · derived from detection history`)
  +`<div class="filters">
    <div class="gsearch" style="width:220px">${icon('search',13)}<input data-f="veh.q" value="${esc(f.q)}" placeholder="Search plate…"></div>
    <div class="chips">${[['all','All'],['sub','Subscribers'],['wl','Watchlisted'],['vis','Visitors']].map(c=>`<button class="fchip ${f.cls===c[0]?'on':''}" data-action="fchip" data-f="veh.cls" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
  </div>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Plate</th><th>Class</th><th>First seen</th><th>Last seen</th><th>Sightings</th><th>Last camera</th><th></th></tr></thead><tbody>
  ${list.map(v=>{
    const last=DB.detections.find(d=>d.plate===v.plate);
    return `<tr class="click" data-action="veh-open" data-id="${esc(v.plate)}">
    <td><span class="plate">${esc(v.plate)}</span></td>
    <td>${v.sub?chip('SUBSCRIBER','c-acc'):v.wl?chip('WATCHLIST','c-dgr'):chip('VISITOR','c-mut')}</td>
    <td class="mono" style="font-size:11.5px;color:var(--text-secondary)">${fmtDT(v.first)}</td>
    <td class="mono" style="font-size:11.5px;color:var(--text-secondary)">${fmtDT(v.last)}</td>
    <td class="mono">${v.n}</td>
    <td style="font-size:12px">${esc(last?camById(last.cam).name:'—')}</td>
    <td>${icon('chevron-right',14)}</td></tr>`}).join('')||
    `<tr><td colspan="7"><div class="empty"><div class="eic">${icon('car',20)}</div><b>No vehicles match</b><p>Clear the search or filter to see all plates.</p></div></td></tr>`}
  </tbody></table></div>`;
};

VIEWS.alerts=()=>{
  const t=S.ui.alertTab;
  const act=DB.alerts.filter(a=>a.state==='active'),ack=DB.alerts.filter(a=>a.state==='ack');
  const list=t==='active'?act:t==='ack'?ack:DB.incidents;
  const sevTone=s=>s==='danger'?['HIGH','c-dgr']:s==='warning'?['MEDIUM','c-wrn']:['INFO','c-info'];
  const card=a=>{
    const st=sevTone(a.sev);
    return `<div class="alertcard ${a.sev==='danger'?'':a.sev==='warning'?'wrn':'info'}" style="margin-bottom:10px">
      <div class="thumb" style="width:88px;height:52px;align-self:center">${icon('car-front',30)}<span>${esc(a.plate.replace(/\s/g,''))}</span></div>
      <div class="alert-main">
        <div class="top"><span class="plate">${esc(a.plate)}</span>${chip(st[0],st[1])}${a.state==='ack'?chip('ACKNOWLEDGED','c-mut'):a.state==='esc'?chip('INCIDENT','c-dgr'):chip('ACTIVE','c-wrn')}</div>
        <div class="meta">${esc(a.reason)}</div>
        <div class="meta">${esc(a.cam)} · ${esc(a.site)} · <span data-ago="${a.ts}">${ago(a.ts)}</span></div>
      </div>
      <div class="alert-act">
        ${a.state==='active'&&can('sec.ack')?`<button class="btn btn-sm btn-sec" data-action="alert-ack" data-id="${a.id}">Acknowledge</button>`:''}
        ${a.state==='active'&&can('sec.escalate')?`<button class="btn btn-sm btn-dgr" data-action="alert-esc" data-id="${a.id}">Escalate</button>`:''}
        ${a.state==='ack'?`<button class="btn btn-sm btn-ghost" data-action="alert-reopen" data-id="${a.id}">Reopen</button>`:''}
        <button class="icobtn" data-action="alert-open" data-id="${a.id}" title="Details">${icon('chevron-right',15)}</button>
      </div></div>`;
  };
  const incCard=i=>`<div class="alertcard" style="margin-bottom:10px">
    <div class="alert-main"><div class="top"><span class="mono" style="font-weight:700">${i.id}</span><span class="plate">${esc(i.plate)}</span>${chip('INCIDENT','c-dgr')}${chip(i.state==='res'?'RESOLVED':'OPEN',i.state==='res'?'c-ok':'c-wrn')}</div>
    <div class="meta">${esc(i.reason)} · escalated from ${i.from} · <span data-ago="${i.ts}">${ago(i.ts)}</span></div></div>
    <div class="alert-act">
      ${i.state!=='res'?`<button class="btn btn-sm btn-sec" data-action="incident-res" data-id="${i.id}">Resolve</button>`:''}
      <button class="icobtn" data-action="alert-open" data-id="${i.id}">${icon('chevron-right',15)}</button></div></div>`;
  return vhead('Alerts & Incidents','Security events from watchlists, gates and recognition quality',
    can('sec.manage')?`<button class="btn btn-sec" data-action="nav" data-id="watchlists">${icon('flag',14)}Manage watchlists</button>`:'')
  +`<div class="tabs">
    <button class="tab ${t==='active'?'on':''}" data-action="alert-tab" data-id="active">Active <span class="tabn">${act.length}</span></button>
    <button class="tab ${t==='ack'?'on':''}" data-action="alert-tab" data-id="ack">Acknowledged <span class="tabn">${ack.length}</span></button>
    <button class="tab ${t==='incidents'?'on':''}" data-action="alert-tab" data-id="incidents">Incidents <span class="tabn">${DB.incidents.length}</span></button>
  </div>
  ${(t==='incidents'?list.map(incCard):list.map(card)).join('')||`<div class="card"><div class="empty"><div class="eic">${icon('siren',20)}</div><b>Nothing here</b><p>${t==='active'?'No active alerts. New watchlist matches appear here instantly.':t==='ack'?'Acknowledged alerts are archived here for 30 days.':'Escalate an alert to open a tracked incident.'}</p></div></div>`}`;
};

VIEWS.sessions=()=>{
  const f=S.ui.sess;
  let list=DB.sessions.filter(s=>
    (f.f==='all'||s.status===f.f||(f.f==='unpaid'&&(s.status==='unpaid'||(s.pay&&s.pay.status==='pending'))))&&

    can('kiosk.use')?`<button class="btn btn-sec" data-action="kiosk-open">${icon('monitor',14)}Kiosk mode</button>`:'')

    <div class="gsearch" style="width:200px">${icon('search',13)}<input data-f="sess.q" value="${esc(f.q)}" placeholder="Search plate…"></div>
    <div class="chips">${[['all','All'],['active','Active'],['complete','Completed'],['unpaid','Unpaid']].map(c=>`<button class="fchip ${f.f===c[0]?'on':''}" data-action="fchip" data-f="sess.f" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>

    <td class="mono" style="font-size:12px">${s.exit?durStr(s.entry,s.exit):`<span data-dur="${s.entry}">${durStr(s.entry)}</span>`}</td>
    <td class="mono">${s.sub?'—':fmtMoney(s.amount||tariffFor(s))}</td>
    <td>${s.pay?chip(s.pay.method.toUpperCase(),s.pay.status==='settled'?'c-ok':'c-wrn'):s.sub?chip('SUBSCRIPTION','c-acc'):chip('UNPAID','c-dgr')}</td>
    <td>${chip(s.status.toUpperCase(),s.status==='active'?'c-acc':s.status==='complete'?'c-ok':'c-dgr')}</td></tr>`).join('')||
    `<tr><td colspan="7"><div class="empty"><div class="eic">${icon('timer',20)}</div><b>No sessions match</b></div></td></tr>`}
  </tbody></table></div>`;

VIEWS.session=()=>{
  const s=DB.sessions.find(x=>x.id===S.params.id)||DB.sessions[0];
  const amount=s.sub?0:(s.amount||tariffFor(s));
  const tab=S.ui.sess.tab||'overview';
  const tabs=[['overview','Overview'],['timeline','Timeline'],['vehicle','Vehicle'],['payments','Payments'],['receipts','Receipts'],['images','Images'],['audit','Audit']];
  const dets=DB.detections.filter(d=>d.plate===s.plate).slice(0,2);
  let body='';
  if(tab==='overview')body=`<div class="card"><div class="card-b"><div class="kvs" style="grid-template-columns:140px 1fr">
    <span class="k">Session</span><b class="mono">${s.id}</b><span class="k">Plate</span><b><span class="plate">${esc(s.plate)}</span></b>
    <span class="k">Entry</span><b>${fmtDT(s.entry)} · Gate A Entry</b><span class="k">Exit</span><b>${s.exit?fmtDT(s.exit)+' · Gate A Exit':'vehicle still inside'}</b>
    <span class="k">Duration</span><b class="mono">${s.exit?durStr(s.entry,s.exit):`<span data-dur="${s.entry}">${durStr(s.entry)}</span>`}</b>
    <span class="k">Tariff applied</span><b>Standard weekday · ${esc(DB.tariff.brackets[2].label)}</b>
    <span class="k">Amount</span><b style="font-size:16px" class="mono">${s.sub?'Subscriber — no charge':fmtMoney(amount)}</b>
    <span class="k">Payment</span><b>${s.pay?chip(s.pay.method.toUpperCase()+' · '+s.pay.status.toUpperCase(),s.pay.status==='settled'?'c-ok':'c-wrn'):s.sub?chip('SUBSCRIPTION','c-acc'):chip('UNPAID','c-dgr')}</b>
  </div></div></div>`;
  if(tab==='timeline')body=`<div class="card card-b">${[
    [s.entry,'Entry detected — '+esc(s.plate)+' at Gate A Entry (94%)'],
    [s.entry+3000,'Barrier opened · access authorized'+(s.sub?' · subscriber':'')],
    [s.exit?s.exit:Date.now(),s.exit?'Exit detected at Gate A Exit (96%) · barrier opened':'Vehicle still on site'],
    [s.exit?s.exit+4000:Date.now(),'Duration computed'+(s.exit?' · '+durStr(s.entry,s.exit):'')]
  ].map(l=>`<div class="tline"><span class="tdot"></span><span class="tt">${fmtT(l[0])}</span><span style="font-size:12.5px">${esc(l[1])}</span></div>`).join('')}</div>`;
  if(tab==='vehicle')body=`<div class="card card-b kvs"><span class="k">Plate</span><b><span class="plate">${esc(s.plate)}</span></b>
    <span class="k">Class</span><b>${s.sub?'Subscriber':'Visitor'}</b><span class="k">Sightings (30 d)</span><b class="mono">${RN(2,28)}</b>
    ${s.sub?`<span class="k">Subscription</span><b>${esc((DB.subscribers.find(x=>x.plates.includes(s.plate))||{}).name||'')} · ${esc((DB.subscribers.find(x=>x.plates.includes(s.plate))||{}).plan||'')}</b>`:''}</div>`;
  if(tab==='payments')body=s.pay?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Ref</th><th>Time</th><th>Method</th><th>Amount</th><th>Status</th></tr></thead><tbody>
    <tr><td class="mono">${s.pay.ref}</td><td class="mono" style="font-size:11.5px">${fmtDT(s.exit)}</td><td>${s.pay.method}</td><td class="mono">${fmtMoney(amount)}</td><td>${chip(s.pay.status.toUpperCase(),s.pay.status==='settled'?'c-ok':'c-wrn')}</td></tr></tbody></table></div>`
    :`<div class="card"><div class="empty"><div class="eic">${icon('credit-card',20)}</div><b>No payment recorded yet</b>${!s.sub?`<button class="btn btn-sec" data-action="sess-pay" data-id="${s.id}">Record payment</button>`:''}</div></div>`;
  if(tab==='receipts')body=s.pay?`<div class="card card-b" style="max-width:340px">
    <div style="text-align:center;font-weight:700;margin-bottom:8px">${esc(S.brand.appName)} — Receipt</div>
    <div class="kvs"><span class="k">Receipt</span><b class="mono">${s.pay.ref}</b><span class="k">Plate</span><b class="mono">${esc(s.plate)}</b>
    <span class="k">Duration</span><b class="mono">${s.exit?durStr(s.entry,s.exit):'—'}</b><span class="k">Amount</span><b class="mono">${fmtMoney(amount)}</b>
    <span class="k">Method</span><b>${s.pay.method}</b></div>
    <button class="btn btn-sec btn-sm" style="margin-top:12px" data-action="print-receipt" data-id="${s.pay.ref}">${icon('printer',13)}Print</button></div>`
    :`<div class="card"><div class="empty"><div class="eic">${icon('receipt',20)}</div><b>No receipt yet</b></div></div>`;
  if(tab==='images')body=`<div class="grid2-eq">${(dets.length?dets:[{cam:'c1',plate:s.plate,conf:94}]).map((d,i)=>`
    <div class="card"><div class="card-h"><h3>${i===0?'Entry image':'Exit image'}</h3></div><div class="card-b" style="padding:10px">
    <div class="vidwrap" style="border-radius:8px;overflow:hidden"><canvas class="camcanvas" data-snap='${esc(JSON.stringify({cam:d.cam,plate:d.plate,conf:d.conf}))}'></canvas></div>
    <div style="display:flex;justify-content:center;margin-top:10px"><div class="platecrop" style="padding:5px 12px"><b style="font-size:16px">${esc(d.plate.replace(/\s/g,''))}</b></div></div></div></div>`).join('')}</div>`;
  if(tab==='audit')body=`<div class="card card-b">${[[s.entry,'Session opened by detection '+fmtT(s.entry)],[(s.exit||Date.now())-2000,'Tariff resolved — standard weekday']].map(l=>`<div class="tline"><span class="tdot"></span><span class="tt">${fmtT(l[0])}</span><span style="font-size:12.5px">${esc(l[1])}</span></div>`).join('')}</div>`;
  return vhead(`Session ${s.id}`,'',
    `<button class="btn btn-sec" data-action="nav" data-id="sessions">${icon('chevron-left',14)}All sessions</button>
     ${s.status==='active'&&!s.sub&&can('park.close')?`<button class="btn btn-dgr" data-action="sess-close" data-id="${s.id}">Close session</button>`:''}`)
  +`<div class="tabs">${tabs.map(t=>`<button class="tab ${tab===t[0]?'on':''}" data-action="sess-tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>${body}`;
};

VIEWS.payments=()=>{
  const t=DB.payments.filter(p=>p.ts>Date.now()-20*3600000);
  const sum=f=>t.filter(f).reduce((n,p)=>n+p.amount,0);
  return vhead('Payments',`${DB.payments.length} transactions · today shown below`,
    can('kiosk.use')?`<button class="btn btn-prim" data-action="kiosk-open">${icon('monitor',14)}Open kiosk mode</button>`:'')
  +`<div class="statband">

        ${s.gates.length?`<div class="grid2-eq">${s.gates.map(g=>`<div style="border:1px solid var(--border);border-radius:8px;padding:10px">

        ${s.cams.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${s.cams.map(c=>chip('CAM · '+camById(c).name.toUpperCase(),'c-mut')).join('')}</div>`:''}

AFTERS.hardware=()=>{startTimer(()=>{ if(S.route!=='hardware')return;
  DB.cameras.forEach(c=>{ if(!c.fps)return;

VIEWS.health=()=>{
  const tone={ok:['HEALTHY','c-ok'],warn:['DEGRADED','c-wrn'],down:['OFFLINE','c-dgr'],dis:['DISABLED','c-mut']};
  const groups=DB.health.map(g=>{
    let state=g.state;
    if(g.id==='pay'&&!S.modules.payments)state='dis';
    return {g:g,state:state};
  });
  return vhead('System Health','Grouped subsystem status · Disabled is a neutral state, not an error',
    `<button class="btn btn-sec" data-action="nav" data-id="hardware">${icon('wrench',14)}Hardware Lab</button>`)
  +`<div class="healthgrid">${groups.map(o=>{
    const g=o.g,state=o.state;
    const t=tone[state];
    const gic=g.id==='db'?'database':g.id==='media'?'server':g.id==='rec'?'cpu':g.id==='cams'?'video':g.id==='gates'?'door-open':g.id==='pay'?'banknote':g.id==='workers'?'server':'activity';
    return `<div class="card" style="cursor:pointer" data-action="health-open" data-id="${g.id}">
      <div class="card-h"><h3>${icon(gic,14)}${g.name}</h3>
      ${chip(t[0],t[1])}</div>
      <div class="card-b" style="padding-top:10px;font-size:12px;color:var(--text-secondary)">${esc(g.metric)}
      ${state==='dis'?'<div style="font-size:11px;color:var(--text-tertiary);margin-top:4px">Module disabled — no data collected, no error.</div>':''}
      </div></div>`}).join('')}</div>`;
};

function renderKiosk(){
  S.screen='kiosk';$('#app').classList.add('hidden');$('#kiosk').classList.remove('hidden');
  K=K||{st:'idle',plate:'',sess:null};
  let mid='';
  if(K.st==='idle'){
    const keys='QWERTYUIOPASDFGHJKLZXCVBNM'.split('');
    mid=`<div class="k-title">Enter your plate number</div>
    <div class="k-sub">or let the gate camera read it as you approach</div>
    <div class="k-plate" id="k-plate">${K.plate||'&nbsp;'}</div>
    <div class="k-pad">${keys.map(k=>`<button class="k-key" data-action="k-key" data-id="${k}">${k}</button>`).join('')}
      <button class="k-key" data-action="k-key" data-id="back">⌫</button>
      <button class="k-key" data-action="k-key" data-id="space">␣</button>
      <button class="k-key" data-action="k-key" data-id="clr">CLR</button>
      ${'0123456789'.split('').map(n=>`<button class="k-key" data-action="k-key" data-id="${n}">${n}</button>`).join('')}
    </div>
    <button class="btn btn-prim k-pay" data-action="k-find" style="width:100%">Find my session</button>`;
  }else if(K.st==='processing'){
    mid=`<div class="spin-lg"></div><div class="k-title">Looking up your session…</div>`;
  }else if(K.st==='found'){
    mid=`<div class="k-title" style="margin-bottom:14px">${esc(K.sess.plate)}</div>
    <div style="font-size:13px;color:var(--text-secondary)">Entered ${fmtT(K.sess.entry)} · <span data-dur="${K.sess.entry}">${durStr(K.sess.entry)}</span></div>
    <div class="k-amount">${fmtMoney(K.amount)}</div>
    <button class="btn btn-prim k-pay" data-action="k-pay" style="width:100%">Pay now</button>
    <div style="margin-top:16px"><span class="linkish" data-action="k-reset">Wrong plate? Start over</span></div>`;
  }else if(K.st==='paying'){
    mid=`<div class="spin-lg"></div><div class="k-title">Contacting payment provider…</div><div class="k-sub">Do not leave the kiosk</div>`;
  }else if(K.st==='done'){
    mid=`<div style="width:58px;height:58px;border-radius:50%;background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px">${icon('check-circle',30)}</div>
    <div class="k-title">Payment received</div>
    <div class="k-sub">Receipt ${K.ref} · the exit barrier will open automatically</div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:14px">
      <button class="btn btn-sec" data-action="print-receipt" data-id="${K.ref}">${icon('printer',14)}Print receipt</button>
      <button class="btn btn-prim" data-action="k-reset">Done</button></div>`;
  }else if(K.st==='notfound'){
    mid=`<div class="k-title">No open session found</div>
    <div class="k-sub">Check the plate or see the attendant. ${esc(K.plate)} has no active session today.</div>
    <button class="btn btn-prim" data-action="k-reset" style="width:100%">Try again</button>`;
  }
  $('#kiosk').innerHTML=`
   <div class="k-top">
     <div style="display:flex;gap:10px;align-items:center">${logoSvg(28)}<b style="font-size:16px">${esc(S.brand.appName)}</b></div>
     <div class="k-clock" id="kiosk-clock">${fmtT(Date.now())}</div>
     <button class="btn btn-ghost btn-sm" data-action="k-exit">${icon('log-out',13)}Exit kiosk</button>
   </div>
   <div class="k-mid"><div class="k-panel">${mid}</div></div>`;
}

function searchInput(q){
  const inp=$('#g-search');if(!inp)return;
  if(q.length<2){closePop();return}
  q=q.toLowerCase();
  const plates=[...new Set(DB.detections.map(d=>d.plate))].filter(p=>p.toLowerCase().includes(q)).slice(0,4);
  const sess=DB.sessions.filter(s=>s.id.toLowerCase().includes(q)||s.plate.toLowerCase().includes(q)).slice(0,3);
  const cams=DB.cameras.filter(c=>c.name.toLowerCase().includes(q)).slice(0,3);
  const alerts=DB.alerts.filter(a=>a.plate.toLowerCase().includes(q)).slice(0,2);
  let html='';
  if(plates.length)html+=`<div class="pop-sect">Plates</div>`+plates.map(p=>`<button class="popitem" data-action="search-go" data-id="plate|${esc(p)}">${icon('scan-line',14)}<span class="plate">${esc(p)}</span></button>`).join('');
  if(sess.length)html+=`<div class="pop-sect">Sessions</div>`+sess.map(s=>`<button class="popitem" data-action="search-go" data-id="sess|${s.id}">${icon('timer',14)}${s.id} · ${esc(s.plate)}<span style="margin-left:auto" class="tabn">${s.status}</span></button>`).join('');
  if(alerts.length)html+=`<div class="pop-sect">Alerts</div>`+alerts.map(a=>`<button class="popitem" data-action="search-go" data-id="alert|${a.id}">${icon('siren',14)}${esc(a.plate)} · ${esc(a.reason.slice(0,34))}…</button>`).join('');
  if(cams.length)html+=`<div class="pop-sect">Cameras</div>`+cams.map(c=>`<button class="popitem" data-action="search-go" data-id="cam|${c.id}">${icon('video',14)}${esc(c.name)}</button>`).join('');
  if(!html)html=`<div class="popitem" style="cursor:default;color:var(--text-tertiary)">${icon('search',14)}No matches for “${esc(q)}”</div>`;
  const r=inp.getBoundingClientRect();closePop();
  const el=document.createElement('div');el.className='pop';
  el.style.top=(r.bottom+7)+'px';el.style.left=r.left+'px';el.style.width='360px';
  el.innerHTML=html;$('#pop-root').appendChild(el);
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.pop')&&!e.target.closest('[data-action="pop-"]'))closePop();
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const fn=ACT[el.dataset.action];
  if(fn){e.preventDefault();fn(el,el.dataset.id,e)}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='g-search'){searchInput(el.value);return}
  if(!el.dataset.f)return;
  if(el.dataset.f.indexOf('topo.')===0)return;
  const parts=el.dataset.f.split('.');
  let val=el.value;
  if(el.type==='range')val=+el.value;
  if(parts.length===2){S.ui[parts[0]][parts[1]]=val}else{S.ui[parts[0]]=val}
  const key=parts[parts.length-1];
  if(key==='q'||key==='cf'){S.focusSel=el.dataset.f;rerender()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.perm){const parts=el.dataset.perm.split('|');const role=parts[0],perm=parts[1];
    if(el.checked)DB.roles[role].perms[perm]=1;else delete DB.roles[role].perms[perm];
    renderSidebar();toast('Permission updated for '+DB.roles[role].label,'info');return}
  if(el.id==='wl-logo'){
    const f=el.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{S.brand.logo=rd.result;renderHeader();renderSidebar();toast('Logo uploaded — applied to header, sidebar and login')};
    rd.readAsDataURL(f);return}
  if(el.id==='wl-accent'){
    const v=el.value;
    document.documentElement.style.setProperty('--accent',v);
    document.documentElement.style.setProperty('--accent-strong',shade(v,-12));
    toast('Accent color applied','info');return}
  if(el.dataset.f==='topo.dir'){const ctx=laneById(el.dataset.id);if(ctx){ctx.lane.dir=el.value}rerender();return}
  if(el.dataset.f==='topo.rename'){
    const id=el.dataset.id,val=(el.value||'').trim();
    if(val){DB.sites.forEach(s=>{
      if(s.id===id)s.name=val;
      s.gates.forEach(g=>{ if(g.id===id)g.name=val;
        g.lanes.forEach(l=>{ if(l.id===id)l.name=val;});});
      if(s.cams.indexOf(id)>=0){const c=camById(id);if(c)c.name=val;}
    });
    DB.devices.forEach(d=>{ if(d.id===id)d.name=val; });}
    S.ui.topoEdit=null;rerender();toast('Renamed','info');return}
  if(el.dataset.f==='user.role'){
    const u=DB.users.find(x=>x.id===el.dataset.id);if(u){u.role=el.value;toast(u.name+' is now '+DB.roles[el.value].label)}return}
  if(el.dataset.f){const parts=el.dataset.f.split('.');
    if(parts.length===2)S.ui[parts[0]][parts[1]]=el.value;else S.ui[parts[0]]=el.value;
    rerender()}
});
function shade(hex,pct){
  const n=parseInt(hex.slice(1),16);let r=(n>>16)+Math.round(2.55*pct),g=((n>>8)&255)+Math.round(2.55*pct),b=(n&255)+Math.round(2.55*pct);
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&S.screen==='app'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){
    e.preventDefault();const g=$('#g-search');if(g)g.focus()}
  if(e.key==='Escape'){
    if($('#pop-root .pop'))return closePop();
    if($('#modal-root .overlay'))return closeModal();
    if($('#drawer-root .drawer'))return closeDrawer();
    const g=$('#g-search');if(g===document.activeElement)g.blur();
  }
});
function dlCSV(name,rows){
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();
}

function masterTick(){
  $$('[data-ago]').forEach(el=>el.textContent=ago(+el.dataset.ago));
  $$('[data-dur]').forEach(el=>el.textContent=durStr(+el.dataset.dur));
  const k=$('#kiosk-clock');if(k)k.textContent=fmtT(Date.now());
}
function genDet(){
  const cams=DB.cameras.filter(c=>c.role==='lpr'&&c.st.video==='ok');
  const cam=pick(cams);const r=Math.random();
  return {id:'d'+Date.now()+RN(1,99),ts:Date.now(),plate:pick(PLATES),cam:cam.id,lane:cam.lane,
    conf:RN(80,99),source:REC_LABEL[cam.rec]||'SmartPark AI',status:r<.55?'visitor':r<.85?'authorized':r<.95?'denied':'flagged'};
}
function eventTick(){
  if(S.screen!=='app'||document.hidden)return;
  const det=genDet();DB.detections.unshift(det);
  const cam=camById(det.cam);cam.lastDet=det;
  S.kpi.dets++;
  if(!S.kpi.platesSet.has(det.plate)){S.kpi.platesSet.add(det.plate);S.kpi.unique++}
  if(S.route==='dashboard'){
    const tb=$('#dash-recent');
    if(tb){tb.insertAdjacentHTML('afterbegin',dashRow(det))}
  }
  if(S.route==='cameras'){
    const pl=$(`[data-campl="${det.cam}"]`);if(pl)pl.textContent=det.plate;
    const le=$(`[data-camle="${det.cam}"]`);if(le)le.textContent='just now';
  }
  if(Math.random()<.25){
    DB.notifs.unshift({id:'n'+Date.now(),ic:'scan-line',tone:'ok',txt:'Detection — '+det.plate+' at '+cam.name,ts:Date.now(),read:false});
    renderHeader();
  }
}

seedData();
applyTheme(S.theme);
renderLogin();
setInterval(masterTick,1000);
setInterval(eventTick,9000);
</script>
</body>
