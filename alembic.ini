# Alembic CLI entry point. The Site Service runs migrations itself at startup
# through app/migrations/runner.py; this file exists so operators can run
# `alembic current` / `alembic history` / `alembic upgrade head` by hand.
# The database URL comes from SMARTPARK_DATABASE_URL (or the SQLite default),
# never from this file.
[alembic]
script_location = app/migrations/alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
